[package]
name = "lightx2v-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lightx2v"
path = "src/main.rs"

[dependencies]
lightx2v-core = { version = "0.1.0", path = "../lightx2v-core" }
lightx2v-cpu = { version = "0.1.0", path = "../lightx2v-cpu" }
lightx2v-model = { version = "0.1.0", path = "../lightx2v-model" }
clap = { version = "4.6.7", features = ["derive"] }
